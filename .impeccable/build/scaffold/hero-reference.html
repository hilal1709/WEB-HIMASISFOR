<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-road-v2.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Economica:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7ece2}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-scene region plate" data-region="scene"><img src="../../../assets/plates/scene.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-logo region plate" data-region="logo"><img src="../../../assets/plates/logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-headline-1 region text" data-region="headline-1"><!-- headline line 1 Menghubungkan, navy --><p style="font-size:var(--r-headline-1-font);font-family:var(--r-headline-1-family),sans-serif;font-weight:var(--r-headline-1-weight);line-height:1.05;margin:0">headline-1</p></div>
  <div class="r-headline-2 region text" data-region="headline-2"><!-- headline line 2 Bisnis & Sistem Informasi, red --><p style="font-size:var(--r-headline-2-font);line-height:1.05;margin:0">headline-2</p></div>
  <div class="r-headline-3 region text" data-region="headline-3"><!-- headline line 3 untuk Masa Depan, navy --><p style="font-size:var(--r-headline-3-font);line-height:1.05;margin:0">headline-3</p></div>
  <div class="r-accreditation region text" data-region="accreditation"><!-- Terakreditasi Baik Sekali Â· LAM INFOKOM --><p style="font-size:var(--r-accreditation-font);line-height:1.05;margin:0">accreditation</p></div>
  <div class="r-cta-primary region control" data-region="cta-primary"><!-- red pill button Daftar Sekarang with arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-primary); a control need not have button chrome --></div>
  <div class="r-cta-secondary region control" data-region="cta-secondary"><!-- outline pill button Lihat Kurikulum with book icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-secondary); a control need not have button chrome --></div>
  <div class="r-cliff-tagline region text" data-region="cliff-tagline"><!-- set text on the cliff face: DARI GRESIK UNTUK INDONESIA LEBIH MAJU --><p style="font-size:var(--r-cliff-tagline-font);line-height:1.05;margin:0">cliff-tagline</p></div>
  <div class="r-far-cliff-text region text" data-region="far-cliff-text"><!-- set text on the headland: GRESIK KOTA SEMEN INDONESIA --><p style="font-size:var(--r-far-cliff-text-font);line-height:1.05;margin:0">far-cliff-text</p></div>
  <div class="r-sign-audit region control" data-region="sign-audit"><!-- red wooden signpost IT Audit & Governance: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop sign-audit); a control need not have button chrome --></div>
  <div class="r-sign-enterprise region control" data-region="sign-enterprise"><!-- red wooden signpost Enterprise Systems: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop sign-enterprise); a control need not have button chrome --></div>
  <div class="r-sign-data region control" data-region="sign-data"><!-- red wooden signpost Data Science: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop sign-data); a control need not have button chrome --></div>
  <div class="r-sign-msi region control" data-region="sign-msi"><!-- red wooden arrow signpost Manajemen SI: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop sign-msi); a control need not have button chrome --></div>
  <figure class="r-elvo region plate" data-region="elvo"><img src="../../../assets/plates/elvo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-bubble region chrome" data-region="bubble"><!-- white speech bubble Ikut aku jalan-jalan, ya! --></div>
  <div class="r-nav region control" data-region="nav"><!-- white pill bottom navigation Beranda, Profil, Akademik, Layanan, PMB with icons: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav); a control need not have button chrome --></div>
  <figure class="r-nav-elvo region plate" data-region="nav-elvo"><img src="../../../assets/plates/nav-elvo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
</main>
</body>
</html>
